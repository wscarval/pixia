services:
  postgres:
    image: postgres:16-alpine
    container_name: webrtc-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-webrtc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webrtc}
      POSTGRES_DB: ${POSTGRES_DB:-webrtc_meeting}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-webrtc} -d ${POSTGRES_DB:-webrtc_meeting}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - webrtc-network


  backend:
    build:
      context: ./backend

    container_name: webrtc-backend
    restart: unless-stopped

    environment:
      PORT: 3001
      NODE_ENV: production

      JWT_SECRET: ${JWT_SECRET:-dev-change-this-secret}

      DATABASE_URL: postgresql://${POSTGRES_USER:-webrtc}:${POSTGRES_PASSWORD:-webrtc}@postgres:5432/${POSTGRES_DB:-webrtc_meeting}

      CORS_ORIGIN: ${CORS_ORIGIN:-}

      TURN_SECRET: ${TURN_SECRET:-}
      TURN_URL: ${TURN_URL:-}

      AVATAR_UPLOAD_DIR: /app/uploads/avatars

    volumes:
      - avatar-uploads:/app/uploads/avatars

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - webrtc-network


  frontend:
    build:
      context: ./frontend

      args:
        VITE_STUN_URL: ${VITE_STUN_URL:-stun:stun.cloudflare.com:3478}
        VITE_TURN_ENABLED: ${VITE_TURN_ENABLED:-false}

    container_name: webrtc-frontend
    restart: unless-stopped

    volumes:
      - avatar-uploads:/usr/share/nginx/uploads/avatars:ro

    depends_on:
      - backend

    ports:
      - "80:80"

    networks:
      - webrtc-network


  coturn:
    image: coturn/coturn:4
    container_name: webrtc-coturn

    profiles:
      - turn

    restart: unless-stopped

    network_mode: host

    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"

    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro


networks:
  webrtc-network:
    driver: bridge


volumes:
  postgres-data:
  avatar-uploads: