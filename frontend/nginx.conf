map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# O TLS de pixiaart.com é terminado num proxy na frente deste container
# (Cloudflare/Traefik/outro Nginx). Repassamos o X-Forwarded-Proto que ele
# define; só usamos $scheme (sempre "http" aqui) se ele não mandar nada.
map $http_x_forwarded_proto $proxy_x_forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name pixiaart.com;

  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    proxy_pass http://backend:3001/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
  }

  location /api/ {
    proxy_pass http://backend:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
  }

  location /socket.io/ {
    proxy_pass http://backend:3001/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    # Sem isso o Nginx acumula os frames antes de repassar, o que soma uma
    # latência extra (às vezes 100ms+) em cima do round-trip real do
    # websocket. Crítico pra medição de ping e pra qualquer coisa em tempo
    # real (sinalização WebRTC, chat).
    proxy_buffering off;
    proxy_cache off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
